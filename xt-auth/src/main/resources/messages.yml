card-bind-success: |
  # 🎉 白名单绑定成功
  ---
  * 👤 **玩家名称**：`{player}`
  * 🐧 **绑定 QQ**：`{qq}`
  
  ---
  > 呦呦鹿鸣，食野之苹。我有嘉宾，鼓瑟吹笙。 —— 曹操《短歌行》

