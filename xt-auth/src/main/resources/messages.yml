# ============================================================
#  XingtuBot-Auth · 游戏内锁定期文案（独立消息文件）
# ============================================================
# 未绑定/未登录玩家进服会被登录锁冻结，期间的所有游戏内提示文字在此配置。
# 三端（Bukkit / Velocity / BungeeCord）通用；改完重启生效。
#
# - 支持 § 颜色码（如 §a 绿、§e 黄、§c 红、§f 白）。
# - bossbar 标题会自动去掉 § 颜色码取纯文本，颜色由阶段自动决定（已绑定=绿 / 未完成=黄）。
# - qr-fallback 支持占位符：{group}=QQ群号、{url}=加群链接。

# 刚进服、还没输 QQ 号（bossbar + 引导）
await-qq: "§6欢迎 · 请在聊天框输入你的 QQ号 开始白名单绑定"

# 已输入 QQ、进入「去群里发绑定」阶段（此时地图二维码已强制放到手上）
need-bind: "§e就差一步 · 手持地图用手机 QQ 扫码加群，并在群里发送「绑定」完成头像验证"

# 已绑定、等待在群里点「登录」
need-login: "§a欢迎回来 · 在群里点机器人发的「登录」按钮完成上线"

# 聊天框输入的不是合法 QQ 号
qq-invalid: "§c请输入有效的 QQ 号（5-12 位数字）"

# 绑定服务尚未就绪
not-ready: "§c绑定服务未就绪，请稍后再试"

# 登录成功、解锁时的提示
unlocked: "§a✅ 已登录，祝游戏愉快！"

# 加群二维码兜底文字（仅当 packetevents 运行期不可用、发不了地图时才用；{group}/{url} 为占位符）
qr-fallback: "§e加入 QQ 群：{group} {url}"
