# ==========================================
# 基础配置 (Base)
# ==========================================

# 数据存储类型
# 作用：玩家绑定数据的持久化方式，默认 json。
storage-type: "json"

# 【说明】跨服信道（cross-server-channel / redis-* / server-name）已收归【机器人框架核心】，
# 它是 PAPI/控制台/群服互联/白名单 共用的通用基础设施，不再由本插件配置。
# 请到核心配置 plugins/XingtuBot/config.yml 设置（大脑与所有子服须一致、连同一台 Redis）。
# 本插件的白名单只是这些信道的使用者之一，会自动跟随核心。


# ==========================================
# 白名单与登录配置 (Whitelist & Auth)
# ==========================================

# 是否启用白名单/登录模块
whitelist-enable: true

# 【说明】大脑（主导）/ 手脚（slave）的判定已统一由「机器人框架核心」负责，本插件不再单独配置。
# 请到核心配置 plugins/XingtuBot/config.yml 的 server-role 设置（auto/local/slave）：
#   单机 Bukkit → 本地大脑；挂在 Velocity/BungeeCord 后的子服 → 手脚（由代理大脑统一接管）。
# 本插件会自动跟随核心判定（host.isBrain()），旧的 whitelist-role 键已废弃、即使保留也会被忽略。

# 触发登录的群组消息关键词
# 作用：玩家在 QQ 群内发送此关键词触发系统对其绑定的游戏账号进行解锁。
login-prompt: "登录"

# 触发绑定的群组消息关键词
# 作用：玩家在 QQ 群内发送此关键词完成白名单绑定（系统取发送者头像与待验证记录比对）。
binding-prompt: "绑定"

# 绑定流程（头像比对）说明：
#   1. 玩家进服未绑定 → 聊天框输入 QQ 号 → 系统下载【该QQ号的头像】并登记。
#   2. 玩家在群里发送「绑定」→ 系统下载【发送者openid的头像】与登记记录比对，命中即绑定。
# 这两条头像链接对同一个人返回同一张源图（实测 dHash 距离 0），据此关联 openid↔玩家。
# ⚠️ 必须正确配置 openapi-app-id：否则 openid 头像接口会回落成默认企鹅占位图，所有绑定失败。
# ⚠️ 权衡：QQ 头像公开可下载，理论上可被人改成同图顶替；如需强认证请改用验证码方案。

# 单个 QQ(openid) 在 10 分钟窗口内允许的最大失败匹配次数（防反复碰运气），超过则暂时拒绝。
bind-max-attempts: 5

# 玩家已绑定但未解锁时的 Title 副标题提示
# 作用：玩家进服时屏幕中央下方显示的提示。@{bot} 会被替换为机器人的名字。
title-code: "@{bot} 登录"

# 玩家已绑定但未解锁时的聊天框提示语
# ⚠️ 注意：程序源码（WhitelistModule.java）中硬编码读取的键名为 login-mssage（少了一个 e），请保持此拼写，不要纠正为 message！
login-mssage: "🔈§f请在群内发送 §b@{bot} §c登录"


# ==========================================
# 登录提示持续循环 (Title) —— 仅代理大脑(Velocity)生效
# 未登录玩家被冻结期间，每隔几秒按【所处阶段】常驻显示【三种不同】的标题，绑定/登录后自动停：
#   1) 还没声明 QQ      → 「请绑定白名单 · 在聊天框输入 QQ 号」
#   2) 已声明、等群内绑定 → 「就差一步 · 在群里发送『绑定』」
#   3) 已绑定、等登录    → 「欢迎回来 · 在群里点『登录』按钮」
# 阶段由大脑按绑定状态实时判定，文案目前内置（如需自定义文案告诉作者再外放）。
# ==========================================
login-reminder-enable: true
# 刷新间隔（秒）。标题停留时长自动覆盖到下次刷新，避免闪烁/空档。
login-reminder-seconds: 3


# ==========================================
# 免密登录 (Auto / Button Login) —— 代理大脑(Velocity/BungeeCord) 与 单机 Bukkit 本地模式均生效
# ==========================================
# 自动登录信任期(分钟)：玩家登录后退出，在此时长内、且【从同一 IP】重进 → 自动登录、无需再操作。
# 安全：信任期【绑定 IP】——换 IP 或过期一律落回群内「登录」（重新走 openid 验证）；
#       仅靠伪造用户名无法自动登录（IP 对不上）。0 = 关闭（每次进服都需重新登录）。默认 720 = 12 小时。
# 代理模式 IP 在代理端可见；单机 Bukkit 本地模式 IP 在本服可见，二者均支持。首次登录仍需群内验证，之后同设备重进才免密。
auto-login-window-minutes: 720

# 已绑定但需登录的玩家进服时，是否在群里发一张带「登录」按钮的免密登录卡片（绑定的 QQ 点一下即登录）。
login-button-announce: true
# 卡片上的按钮文字（点击回传的指令固定为上面的 login-prompt，所以点按钮 = 发「登录」）。
login-button-label: "✅ 同意登录"
# 卡片是否标注玩家的【省级】地区（在线 IP 定位，仅到省份如「广东」，不显示 IP/城市，保护隐私）。
login-announce-region: true
# 卡片发往哪些群：复用群服互联的 allowed-groups（在 xt-chatlink/config.yml，或本插件同名键）；
# 含 "*" 或留空 = 发到全部已知群。下面这个本地副本仅在你想让 auth 用独立群名单时填。
allowed-groups:
  - "*"


# ==========================================
# 群内成功回复文案 (Group Reply · Markdown 卡片)
# ==========================================
# 绑定成功 / 登录成功 时，回复到 QQ 群的【Markdown 卡片】，可随意排版让玩家有好心情
# （需机器人具备原生 markdown 权限）。占位符：{player}=游戏名，{qq}=QQ号。
# 整段留空则使用插件内置的默认卡片。失败/报错类提示仍为普通文本（简短，不做卡片）。
messages:
  # 绑定（注册）成功卡片
  bind-success: |-
    ## 🎉 绑定成功 · 欢迎加入！
    👤 **玩家**　{player}
    🐧 **QQ**　　{qq}

    > 🌟 白名单已开通，进服开启你的冒险吧~
  # 登录成功卡片（{qq} 在登录场景不可用）
  login-success: |-
    ## ✅ 登录成功 · 欢迎回来！
    👤 **玩家**　{player}

    > 🎮 一切就绪，祝你玩得开心！


# ==========================================
# 进服二维码引导配置 (Join QR Map)
# 未绑定玩家进服时，引导其加群的二维码展示配置
# ==========================================

# 是否启用加群二维码引导功能
group-qr-enable: true

# QQ 群号
# 作用：会在聊天框提示中展示。如果未配置加群链接，二维码也会直接编码此纯数字群号。
qq-group: "582224783"

# 加群链接（优先）
# 作用：如果填写了该链接，二维码将直接编码此 URL，玩家用手机 QQ 扫码后可直接弹出加群界面（推荐使用群资料里分享的短链）。
group-join-url: "https://qm.qq.com/q/FEK78ZAOWY"

# 二维码展现样式
# 作用：向玩家展示加群二维码的方式。
# 可选值:
# - "chat": 聊天框模式。发送一行可悬停的消息，鼠标放上去后展开字符组成的迷你二维码（无任何前置插件依赖）。
# - "map" : 虚拟地图模式。纯发包将带有二维码的地图显示在玩家当前手持槽位上，不污染真实背包（PacketEvents 已内置进本插件 jar，无需另装；若运行期不可用则自动退回 chat 模式）。
# - "both": 两者都发。
group-qr-style: "map"