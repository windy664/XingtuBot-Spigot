# ==========================================
# xt-auth 白名单 / 登录 配置
# ==========================================

# 总开关（false = 不启用白名单和登录流程）
whitelist-enable: true

# 玩家在 QQ 群发送这些词触发对应流程
login-prompt: "登录"
binding-prompt: "绑定"

# 同 IP 重进自动登录的信任期（分钟），0 = 关闭（每次都要群内登录）
auto-login-window-minutes: 720

# ---- 加群二维码 ----
# 未绑定玩家进服时发二维码引导加群
group-qr-enable: true
qq-group: "582224783"
group-join-url: "https://qm.qq.com/q/FEK78ZAOWY"

# 登录按钮发往哪些群。
# "*" 或留空 = 继承核心 common-core 的 allowed-groups；填写具体群 = 在核心白名单内再缩小范围。
allowed-groups:
  - "*"

# 单个 QQ 10 分钟内最大绑定失败次数（防碰运气），超过暂时拒绝
bind-max-attempts: 5

# 绑定数据持久化方式：json（默认） / sqlite
storage-type: "json"
