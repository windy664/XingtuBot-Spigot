plugins {
    id 'com.github.johnrengelman.shadow'
    id 'org.springframework.boot' version '2.7.18'
}

dependencies {
    // ─── 平台 SDK（compileOnly：运行期由各平台提供）───
    compileOnly 'org.spigotmc:spigot-api:1.12.2-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.6'  // Bukkit PAPI 扩展
    compileOnly 'net.md-5:bungeecord-api:1.20-R0.2-SNAPSHOT'
    compileOnly 'com.velocitypowered:velocity-api:3.1.1'
    annotationProcessor 'com.velocitypowered:velocity-api:3.1.1'

    // ─── Spring Boot ───
    implementation('org.springframework.boot:spring-boot-starter:2.7.18') {
        exclude group: 'org.yaml', module: 'snakeyaml'  // 核心自带
    }

    // ─── 核心依赖 ───
    implementation 'org.java-websocket:Java-WebSocket:1.5.3'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.yaml:snakeyaml:1.33'
    implementation 'com.google.zxing:core:3.5.2'

    // Redis（跨服信道）
    implementation 'redis.clients:jedis:5.1.0'
}

base {
    archivesName = 'XingtuBot'
}

// ==================== shadowJar（中间产物：relocate 依赖，给 bootJar 合并用） ====================

shadowJar {
    archiveClassifier.set('shadow')  // 中间产物，不覆盖最终 jar

    dependencies {
        exclude(dependency('org.springframework.boot:.*'))
        exclude(dependency('org.springframework:.*'))
    }

    relocate 'org.yaml.snakeyaml', 'org.lib.snakeyaml'
    relocate 'com.google.zxing', 'org.lib.zxing'
    relocate 'com.google.gson', 'org.lib.gson'
    relocate 'redis.clients', 'org.lib.jedis'
    relocate 'org.apache.commons.pool2', 'org.lib.pool2'

    exclude '**/META-INF/native-image/**'
}

jar.enabled = false

// ==================== bootJar（最终产物：XingtuBot-2.2.1.jar，四合一） ====================
// 双击即跑（Spring Boot），扔进 plugins/ 也能当 Bukkit/Velocity 插件

afterEvaluate {
    assemble.dependsOn -= bootJar
}
bootJar {
    dependsOn shadowJar
    archiveBaseName.set('XingtuBot')
    archiveClassifier.set('')           // 最终产物 = XingtuBot-2.2.1.jar
    archiveVersion.set(project.version) // 2.2.1
    mainClass = 'org.windy.xingtubot.springboot.XingtuBotSpringApplication'
    manifest {
        attributes 'Main-Class': 'org.springframework.boot.loader.PropertiesLauncher'
    }
    // 把 shadowJar 的内容（common-core + 三端适配 + relocate 后的依赖）合进 BOOT-INF/classes/
    from shadowJar
    // BOOT-INF/lib/ 排除平台 SDK（核心依赖已在 BOOT-INF/classes/ 里 via shadowJar，共存不影响）
    classpath = classpath.filter { f ->
        !f.name.contains('spigot-api') &&
        !f.name.contains('velocity-api') &&
        !f.name.contains('bungeecord-api') &&
        !f.name.contains('placeholderapi')
    }
}

// ==================== buildAll 改为依赖 bootJar ====================
build.dependsOn bootJar

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
