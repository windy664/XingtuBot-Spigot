plugins {
    id 'com.github.johnrengelman.shadow'
}

dependencies {
    // ─── 平台 SDK（compileOnly：运行期由各平台提供）───
    compileOnly 'org.spigotmc:spigot-api:1.12.2-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.6'  // Bukkit PAPI 扩展
    compileOnly 'net.md-5:bungeecord-api:1.20-R0.2-SNAPSHOT'
    compileOnly 'com.velocitypowered:velocity-api:3.1.1'
    annotationProcessor 'com.velocitypowered:velocity-api:3.1.1'

    // ─── 核心依赖（implementation → shadow 打包进 jar）───
    implementation 'org.java-websocket:Java-WebSocket:1.5.3'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.yaml:snakeyaml:1.33'
    implementation 'com.google.zxing:core:3.5.2'

    // Redis（跨服信道）
    implementation 'redis.clients:jedis:5.1.0'

    // 数据库驱动
    implementation 'org.xerial:sqlite-jdbc:3.45.1.0'
    compileOnly 'com.mysql:mysql-connector-j:8.3.0'
}

base {
    archivesName = 'XingtuBot'
}

shadowJar {
    archiveBaseName.set('XingtuBot')
    archiveClassifier.set('')

    relocate 'org.yaml.snakeyaml', 'org.lib.snakeyaml'
    relocate 'com.google.zxing', 'org.lib.zxing'
    relocate 'com.google.gson', 'org.lib.gson'
    relocate 'redis.clients', 'org.lib.jedis'
    relocate 'org.apache.commons.pool2', 'org.lib.pool2'

    exclude '**/META-INF/native-image/**'
    mergeServiceFiles()
}

build.dependsOn shadowJar

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
