plugins {
    id 'com.github.johnrengelman.shadow'
    // spring-boot 插件不再需要——四合一 jar 不用 bootJar/PropertiesLauncher
}

dependencies {
    // ─── 平台 SDK（compileOnly：运行期由各平台提供）───
    compileOnly 'org.spigotmc:spigot-api:1.12.2-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.6'  // Bukkit PAPI 扩展
    compileOnly 'net.md-5:bungeecord-api:1.20-R0.2-SNAPSHOT'
    compileOnly 'com.velocitypowered:velocity-api:3.1.1'
    annotationProcessor 'com.velocitypowered:velocity-api:3.1.1'

    // ─── Spring Boot ───
    implementation('org.springframework.boot:spring-boot-starter:2.7.18') {
        exclude group: 'org.yaml', module: 'snakeyaml'  // 核心自带
    }

    // ─── 核心依赖 ───
    implementation 'org.java-websocket:Java-WebSocket:1.5.3'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.yaml:snakeyaml:1.33'
    implementation 'com.google.zxing:core:3.5.2'

    // Redis（跨服信道）
    implementation 'redis.clients:jedis:5.1.0'
}

base {
    archivesName = 'XingtuBot'
}

// ==================== shadowJar（中间产物：给附属模块编译用，不含 Spring Boot） ====================

shadowJar {
    archiveClassifier.set('shadow')

    dependencies {
        exclude(dependency('org.springframework.boot:.*'))
        exclude(dependency('org.springframework:.*'))
    }

    relocate 'org.yaml.snakeyaml', 'org.lib.snakeyaml'
    relocate 'com.google.zxing', 'org.lib.zxing'
    relocate 'com.google.gson', 'org.lib.gson'
    relocate 'redis.clients', 'org.lib.jedis'
    relocate 'org.apache.commons.pool2', 'org.lib.pool2'

    exclude '**/META-INF/native-image/**'
}

jar.enabled = false

// ==================== 四合一 fatJar ====================
// 所有类 + 依赖都在 jar 根目录，一个 jar 同时满足四端：
//   java -jar    → Spring Boot 独立运行（Main-Class 直接引导）
//   Velocity     → velocity-plugin.json + 类在根目录 → PluginClassLoader 正常加载
//   Bukkit       → plugin.yml + 类在根目录
//   BungeeCord   → bungee.yml + 类在根目录

task fatJar(type: Jar, dependsOn: shadowJar) {
    archiveBaseName.set('XingtuBot')
    archiveClassifier.set('')
    archiveVersion.set(project.version)

    // 1. 核心类 + relocate 后的依赖（shadowJar 解压到根目录）
    from(zipTree(shadowJar.archiveFile))

    // 2. Spring Boot 依赖也解压到根目录（java -jar 需要，插件端无害）
    from {
        configurations.runtimeClasspath
                .filter { f -> f.name.endsWith('.jar') && !f.name.contains('spigot-api') && !f.name.contains('velocity-api') && !f.name.contains('bungeecord-api') && !f.name.contains('placeholderapi') }
                .collect { zipTree(it) }
    } {
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/native-image/**'
        exclude 'META-INF/services/**'
    }

    // 3. 平台描述文件（注解处理器产物 + 资源文件）
    from("${buildDir}/classes/java/main") {
        include 'velocity-plugin.json'
    }
    from("${buildDir}/resources/main") {
        include 'plugin.yml'
        include 'bungee.yml'
    }

    manifest {
        attributes 'Main-Class': 'org.windy.xingtubot.springboot.XingtuBotSpringApplication'
    }

    // shadowJar 的 relocate 类优先（避免未 relocate 的原始类覆盖）
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

build.dependsOn fatJar

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
