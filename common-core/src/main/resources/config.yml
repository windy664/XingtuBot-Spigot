# 调试模式
debug: false

# QQ 开放平台凭据
openapi-app-id: ""
openapi-client-secret: ""

####################################
# 机器人超级管理员
####################################
admin-openids:
  - ""

####################################
# 群聊白名单（机器人只响应这些群的消息）
#   ["*"] 或 []          = 全部群允许（默认）
# 单聊（C2C）不受此限制。群 openid 获取：开 debug → 群里 @机器人 → 看 group_openid。
####################################
allowed-groups:
  - "*"

####################################
# 跨服信道（通用基础设施：PAPI / 远程控制台 / 群服互联 / 白名单 都经它在代理大脑与 Bukkit 子服间通信）
# 仅在「代理大脑 + Bukkit 子服」部署下有意义；单机本地大脑用不到。
#   plugin-message = 原生插件消息（默认，零依赖）。靠玩家连接转发：子服发包需该子服有在线玩家当”载体”，
#                    控制台下发到”空子服”会失败。
#   redis          = Redis 发布订阅（推荐）。无需在线玩家即可双向通信，
#                    控制台也能下发到没人的子服；需一台 Redis。
#
# ⚠️ 全网一致：代理大脑与所有 Bukkit 子服必须填【相同】的 cross-server-channel，且连同一台 Redis。
cross-server-channel: redis

# Redis 连接（仅当 cross-server-channel 为 redis 且 redis-host 非空时启用）。
redis-host: "127.0.0.1"
redis-port: 6379
redis-password: ""

####################################
# 敏感词过滤（全局配置，防机器人在QQ上发敏感内容被封）
# 所有扩展统一走这里，不再各自配置开关
####################################
sensitive-filter:
  Enable: true
  Replacement: '*'
  Local:
    - NMSL
    - fuck
    - shit
  Cloud-Thesaurus:
    Enabled: true
    Ignored: ['nt']
    Urls:
      - 'https://raw.githubusercontent.com/Yurinann/Filter-Thesaurus-Cloud/main/database.json'
      - 'https://raw.githubusercontent.com/konsheng/Sensitive-lexicon/main/ThirdPartyCompatibleFormats/TrChat/SensitiveLexicon.json'
  Ignored-Punctuations:
    - '!'
    - '.'
    - ','
    - '#'
    - '$'
    - '%'
    - '&'
    - '*'
    - '('
    - ')'
    - '|'
    - '?'
    - '/'
    - '@'
    - '"'
    - '\\'
    - ';'
    - '['
    - ']'
    - '{'
    - '}'
    - '+'
    - '~'
    - '-'
    - '_'
    - '='
    - '^'
    - '<'
    - '>'
    - ' '
    - '　'
    - '！'
    - '。'
    - '，'
    - '￥'
    - '（'
    - '）'
    - '？'
    - '、'
    - '"'
    - "'"
    - "'"
    - '；'
    - '【'
    - '】'
    - '——'
    - '……'
    - '《'
    - '》'
    - '`'

####################################
# 敏感词自动过滤的 handler 列表
# 列表中的 handler 发出的所有文本/Markdown 回复都会自动过敏感词
# handler name：ai-chat(AI对话)、group-chat(群服互联)
####################################
sensitive-filter-handlers:
  - "ai-chat"
  - "group-chat"

