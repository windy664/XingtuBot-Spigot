# XingtuBot-Chatlink: 群服互联配置

# 群服互联功能开关
chatreply-enable: true

# 游戏内聊天格式前缀
chat-format: "§b[QQ群] §f"

# QQ 群消息触发前缀（为空则全部转发）
startsWith: ""

# 游戏→QQ 聊天行 markdown 模板（{player}=玩家名、{message}=发言内容）
chatlink-format: "💬 **{player}**：{message}"

# 未绑定玩家在群里的昵称显示
entries-Empty: "群成员"

# 敏感词过滤（作用于群服互联双向）
sensitive-filter-chatlink: true

# 群聊白名单（群 openid 列表，"*" = 全部群）
allowed-groups:
  - "*"

# 回显前缀（机器人消息→游戏时显示，{bot}=机器人昵称）
echo-format: "§b[{bot}] §f"

##########################################
# 敏感词过滤（详细配置）
# 作用范围：群服互联（玩家↔群双向）
# 命中的词会被替换为 Replacement 字符
##########################################
# 是否启用（总开关）
Enable: true
# 替换字符
Replacement: '*'
# 本地词库
Local:
  - NMSL
  - fuck
  - shit
# 云端词库
Cloud-Thesaurus:
  Enabled: true
  # 云词库里不当敏感词处理的词
  Ignored: ['nt']
  Urls:
    - 'https://raw.githubusercontent.com/Yurinann/Filter-Thesaurus-Cloud/main/database.json'
# 匹配时忽略的标点符号（敏感词中间插入这些字符仍会被匹配）
Ignored-Punctuations:
  - '!'
  - '.'
  - ','
  - '#'
  - '$'
  - '%'
  - '&'
  - '*'
  - '('
  - ')'
  - '|'
  - '?'
  - '/'
  - '@'
  - '"'
  - '\\'
  - ';'
  - '['
  - ']'
  - '{'
  - '}'
  - '+'
  - '~'
  - '-'
  - '_'
  - '='
  - '^'
  - '<'
  - '>'
  - ' '
  - '　'
  - '！'
  - '。'
  - '，'
  - '￥'
  - '（'
  - '）'
  - '？'
  - '、'
  - '"'
  - "'"
  - "'"
  - '；'
  - '【'
  - '】'
  - '——'
  - '……'
  - '《'
  - '》'
  - '`'
