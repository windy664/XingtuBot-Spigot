# 群服互联功能开关
chatreply-enable: true

# QQ 图片在游戏内的显示方式（按玩家是否安装 ChatImage 模组逐玩家分流）
#   auto   = 探测：装 ChatImage 的玩家收 [[CICode,...]]（模组自动渲染成聊天栏图片），
#            未装的收可点击的 [图片] 链接（浏览器打开原图）。
#            探测依赖 XingtuBot-Auth（提供 PacketEvents）；未装时回退为全 CICode（与旧行为一致）。
#   cicode = 全部按 CICode 文本转发（旧行为）
#   link   = 全部按 [图片] 可点击链接转发
chatlink-image-format: "auto"

# 游戏内聊天格式前缀
chat-format: "🐧§cQQ群 §7| §f"

# QQ 群消息触发前缀（为空则全部转发）
startsWith: ""

# 游戏→QQ 聊天行 markdown 模板（{player}=玩家名、{message}=发言内容）
chatlink-format: "💬 **{player}**：{message}"

# 敏感词过滤已统一由 core sensitive-filter.Enable 控制，此处不再单独配置

# 群服互联目标群。
# "*" 或留空 = 继承核心 common-core 的 allowed-groups；填写具体群 = 在核心白名单内再缩小范围。
# 游戏→QQ 主动转发需要最终解析出具体群；若 core 也是 "*"，请在这里填写具体群 openid。
allowed-groups:
  - "*"

# 回显前缀（机器人消息→游戏时显示，{bot}=机器人昵称）
echo-format: "🐧§cQQ群 §7| §f{bot}："
