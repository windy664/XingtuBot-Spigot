plugins {
    id 'com.github.johnrengelman.shadow'
}

// 主插件：common-core + spigot(Bukkit) + velocity → 单个 shadow JAR。
// 功能模块已拆为独立附属插件（xt-*），不再 bundle 进主 JAR。
// spigot/velocity 是编译模块，不单独部署——产物只有本 bundle 的 JAR。
dependencies {
    implementation project(':common-core')
    implementation project(':spigot')
    implementation project(':velocity')
    implementation project(':bungeecord')

    // Redis 跨服信道（RedisChannel/RedisManager 在 common-core）：跨服是核心通用基础设施，
    // 故 jedis 由核心 bundle 打包（不再由 xt-auth 自带）。
    implementation 'redis.clients:jedis:5.1.0'
}

// 本模块无源码，禁用普通 jar，只产出 shadowJar
jar.enabled = false

shadowJar {
    archiveBaseName.set('XingtuBot')
    archiveClassifier.set('')   // 产物：XingtuBot-<version>.jar

    // 重定位第三方库，避免与 Spigot / Velocity 各自自带版本冲突
    // jedis/pool2 已移至 xt-auth 自行 shadow，protobuf 无直接使用已移除
    relocate 'org.yaml.snakeyaml', 'org.lib.snakeyaml'
    relocate 'com.google.zxing', 'org.lib.zxing'
    relocate 'com.google.gson', 'org.lib.gson'
    relocate 'redis.clients', 'org.lib.jedis'
    relocate 'org.apache.commons.pool2', 'org.lib.pool2'

    // sqlite-jdbc 打包进 jar（storage-type=sqlite 开箱即用）。
    // 注意：不要 relocate org.sqlite —— 代码直接 new org.sqlite.JDBC() 注册驱动，重定位会让该引用失配。
    // mysql 驱动已在 common-core 设为 compileOnly（不打包，多服用户自备 mysql-connector-j）。
    exclude '**/META-INF/native-image/**'   // GraalVM AOT 元数据，运行时不需要

    mergeServiceFiles()   // 合并 META-INF/services/java.sql.Driver，使 DriverManager 能发现 sqlite 驱动
}

build.dependsOn shadowJar
