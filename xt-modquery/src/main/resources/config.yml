# ==========================================
# xt-modquery 模组工具配置
# 三个模块：搜索 / 更新订阅 / 新模组发现
# ==========================================

# ==========================================
# 1. 模组搜索（/mod /pack /mr /item /tutorial）
# ==========================================
modsearch-enable: true
# CurseForge 作为额外搜索源（可选）
curseforge-api-key: ""

# ---- MCMOD 百科直查（默认关；开启后 /mod 优先走 MCMOD，搜空自动兜底 Modrinth）----
mcmod-enable: false
# 浏览器打开 mcmod.cn 搜一次 → F12 → 网络 → 复制请求头 Cookie
# 失效（搜不到/验证码拦截）就重新复制。至少含 _uuid 和 MCMOD_SEED。
mcmod-cookie: ""

# ---- 翻译（英文结果→中文，MCMOD 中文原生不需要）----
# ⚠️ 第二个键是 appkey（密钥），不是 secret——填错不生效
baidu-translate-appid: ""
baidu-translate-appkey: ""

# ---- LLM 辅助（可选；中文别名/智能搜索）----
llm-enable: false
llm-api-key: ""
llm-base-url: "https://api.deepseek.com"
llm-model: "deepseek-chat"

# ==========================================
# 2. 模组更新订阅（/modwatch add/remove/list）
# ==========================================
modwatch-enable: true
modwatch-interval-minutes: 60
# /modwatch add 不指定时的默认 MC 版本 / 加载器
modwatch-mc-version: "1.20.1"
modwatch-loader: "forge"
# 预置监控（一般用 /modwatch add 动态添加）
modwatch-list: []

# ==========================================
# 3. 新模组发现（自动推送新出 / 新支持目标版本的模组）
# ==========================================
modwatch-feed-enable: true
# 关注的 MC 版本和加载器（逗号分隔多个）
modwatch-feed-versions: "26.2"
modwatch-feed-categories: "neoforge"
# 每次拉取条数 + 检查间隔（分钟）
modwatch-feed-limit: 20
modwatch-feed-interval-minutes: 120

# ==========================================
# 通知目标群（留空 = 全部已知群）
# ==========================================
notify-target-groups: []
modwatch-feed-notify: []
