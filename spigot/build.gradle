import org.gradle.api.attributes.java.TargetJvmVersion

repositories {
    maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
}

dependencies {
    // ProtocolLib 5.4.0 的 Gradle 元数据标注「需 JVM17」，与本项目 target Java 8 的依赖解析冲突。
    // 它是 compileOnly 软依赖（运行期由服务器提供，现代 MC 服跑 Java 17+），编译器（JDK17 + --release 8）
    // 能正常读其字节码。用 component metadata rule 把它的 jvm.version 属性改写为 8，放行 Gradle 解析。
    components {
        withModule('net.dmulloy2:ProtocolLib') {
            allVariants {
                attributes {
                    attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 8)
                }
            }
        }
    }

    implementation project(':common-core')
    // 功能模块经 ServiceLoader 在 bundle 装配，平台不直接依赖任何 feature 模块。

    compileOnly 'org.spigotmc:spigot-api:1.12.2-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    // AuthMe 依赖已移除：改用自研登录锁（PlayerLockListener + LockState）
    // ProtocolLib：软依赖，仅用于「加群二维码地图」纯发包（不碰真实背包）。
    // 运行期由服务器的 ProtocolLib 提供；没装时自动回退聊天提示，不强制依赖。
    compileOnly 'net.dmulloy2:ProtocolLib:5.4.0'

    // spigot 模块内仍直接使用 Gson（白名单/AI 消息构建）
    implementation 'com.google.code.gson:gson:2.10.1'
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
