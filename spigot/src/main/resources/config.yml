
####################################
# 星途机器人配置（Spigot 与 Velocity 共用同一份）
# 顶部的 WebSocket / server-name / HeartbeatSeconds / deepseek-* 两端都会读取；
# 白名单、群服互联等仅 Spigot 端生效。
####################################
# 是否启用调试模式，输出原始 JSON 消息
debug: false

# mcmod 查询详情用 Markdown 卡片输出（需机器人有原生 markdown 权限，否则 false 用纯文本）
mcmod-markdown: false

##########################################
# 机器人超级管理员（按 openid，webhook 自带不可伪造）
# openid 可在 debug 日志的「收到事件」里 author.member_openid 看到
##########################################
admin-openids:
  - "B2A902B3F33ABE93A73402BB7806E861"

####################################
# 通信模式总开关（三选一，互斥）
#   websocket = 老星途框架 WS（收+回都走下面的 WebSocket 地址）
#   webhook   = SCF 长轮询收事件 + OpenAPI 回复（新机器人用这个）
#   off       = 不启用机器人通信，纯净启动
####################################
bot-mode: websocket

# WebSocket 地址（仅 bot-mode: websocket 时使用）
WebSocket: "ws://127.0.0.1:8080"

# 是否自动连接
AutoOpen: true

# 心跳发送间隔（秒）
HeartbeatSeconds: 90

#跨服标识
server-name: server

##########################################
# Webhook 模式专用配置（仅 bot-mode: webhook 时使用）
#   收事件：插件长轮询 SCF 中转的 /poll 出站拉取
#   发回复：走下面的 OpenAPI 出站，国内可直连、无需备案
##########################################
#SCF 中转的基础地址（只到域名，不带 /poll 或 /qq）
webhook-relay-url: ""
#短轮询间隔（秒）：插件每隔多久向 SCF 取一次消息。
#越大越省 SCF 费用，代价是消息最多延迟这么多秒。建议 3~5。
poll-interval-seconds: 3
#机器人 AppID（开放平台获取，回复发消息用）
openapi-app-id: ""
#机器人 AppSecret / ClientSecret
openapi-client-secret: ""
#是否使用沙箱环境（true=sandbox，false=正式）
openapi-sandbox: false

##########################################
# 回复形态（仅 webhook 模式）：所有文本回复按此发送
#   text       = 只发文字（默认）
#   voice      = 只发语音（文本经 TTS 转 silk）
#   text+voice = 先发文字，再发该文字的语音
# 语音由 SCF 中转完成（默认 Edge TTS，免费零配置，无需任何密钥）
##########################################
reply-mode: text：群里发「测试」或「/demo」触发
# QQ 被动回复每条消息最多 5 次，所以用 demo-types 选本次发哪些
# 可选: text,image,voice,video,markdown（逗号分隔）
##########################################
#本次 demo 发送的类型
demo-types: "text,image,markdown"
#图片地址（公网可达；留空则用 SCF 自带图床 /demo.png）
demo-image-url: ""
#语音地址（silk 格式、公网可达；为空跳过）
demo-voice-url: ""
#视频地址（mp4、公网可达；为空跳过）
demo-video-url: ""
#Markdown 的键盘按钮模板 id（开放平台报备，为空则不带按钮）
demo-markdown-keyboard-id: ""

##########################################
#白名单配置
##########################################

#是否启用白名单
whitelist-enable: true

#白名单角色：auto(默认,按bot-mode自动) / local(强制本地全干) / slave(强制手脚,由Velocity主导)
whitelist-role: auto

##########################################
# 绑定数据存储
#   json   = 单文件 binding.json（默认，零配置，单服够用）
#   sqlite = 单文件 binding.db（零配置；多子服时仅大脑直连，子服走大脑代理）
#   mysql  = 连接 MySQL（多子服共享一份数据，各端直连，推荐多服用）
##########################################
storage-type: json
#--- 仅 storage-type: mysql 时需要 ---
mysql-host: "127.0.0.1"
mysql-port: 3306
mysql-database: "xingtubot"
mysql-user: "root"
mysql-password: ""

force-bind: true

#默认密码，可到 https://www.lddgo.net/string/randompassword 生成
default-password: yC[c=a8G

#登录提示词
login-prompt: "登录"

#Authme注册提示词
register-prompt: "§b📢 §f请输入您的§cQQ号码 §f或 输入§c/register <密码> 密码 §f完成注册"

#输入完毕后的验证码提示词
title-code: "@机器人 /验证"
subtitle-code: "🔈§f请在群内 §c@机器人 /验证 §f完成发送"
login-mssage: "🔈§f请在群内发送 §b@机器人 §c登录 或 §f输入§c/login <密码> §f完成登录"
login-success: "您已成功登录服务器，祝您游戏愉快！"

#######################
#群服互联
#######################

#是否开启群服互联
chatreply-enable: true

#群服互联触发提示词
startsWith: "say"

#无白名单人员昵称
entries-Empty: "群成员"
#服务器内的消息格式
chat-format: "🐧§cQQ群 §7| §f"

#是否启用敏感词处理
Enable: true
Cloud-Thesaurus:
  Enabled: true
  Ignored: ['nt']   # 云词库忽略的词（不当敏感词处理）
  Urls:
    - 'https://raw.githubusercontent.com/Yurinann/Filter-Thesaurus-Cloud/main/database.json'
Local:
  - NMSL
  - fuck
  - shit
Ignored-Punctuations: ['!','.',',','#','$','%','&','*','(',')','|','?','/','@','"','\\',';','[',']','{','}','+','~','-','_','=','^','<','>',' ','　','！','。','，','￥','（','）','？','、','“','‘','；','【','】','——','……','《','》','\\', '`']

Replacement: '*'

######################
#Deepseek API 相关
######################
deepseek-enable: true
deepseek-api-key: "填入你的deepseek key密匙"
#OpenAI 兼容接口地址（默认 DeepSeek）
deepseek-base-url: "https://api.deepseek.com"
ignored-prefix:
  - "^\\."       # 忽略以 . 开头的消息
  - "^/"         # 忽略命令消息
  - "^登录\\s*"   # 忽略以“登录”开头的消息（允许空格）
  - "^list\\b"    # 忽略以 list 开头的单词
  - "^say\\b"     # 忽略以 say 开头的单词
  - "^\\d{4}\\s*" # 忽略以4位数字开头的消息

#AI人格设定
personality: "温柔、体贴、爱说简单话的女朋友，总是安静地倾听，温柔地回应，回复不超过100字"
