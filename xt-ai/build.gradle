// 附属扩展插件：AI 对话（LLM 聊天 + 提供 AiService 供其他附属软依赖）
// 二合一 jar。common-core 走 compileOnly。

dependencies {
    compileOnly project(path: ':common-core', configuration: 'shadow')
    compileOnly 'com.google.code.gson:gson:2.10.1'  // AiService 编译需要（运行期由平台提供）

    compileOnly 'org.spigotmc:spigot-api:1.12.2-R0.1-SNAPSHOT'

    compileOnly 'net.md-5:bungeecord-api:1.20-R0.2-SNAPSHOT'
    compileOnly 'com.velocitypowered:velocity-api:3.1.1'
    annotationProcessor 'com.velocitypowered:velocity-api:3.1.1'
}

base {
    archivesName = 'XingtuBot-AI'
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
