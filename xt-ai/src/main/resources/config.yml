# AI 对话配置

# AI 对话功能开关
llm-enable: true

# LLM API 配置
llm-api-key: ""
llm-base-url: "https://token-plan-cn.xiaomimimo.com/v1"
# 纯文字模型（群聊日常对话，快）
llm-model: "mimo-v2.5"
# 多模态模型（有人发图片时自动切换，能看懂图片）
llm-model-omni: "mimo-v2-omni"

# 生成参数
# temperature：0.7~1.1 偏自然。调高更发散（更啰嗦/更可能说怪话），调低更稳更套路。
llm-temperature: 0.9
# max_tokens：0 = 不发送该字段（推荐，不同 provider 对 max_tokens / max_completion_tokens
# 的支持不一致，不发最保险）。配成 >0 可以限制输出长度、防小作文；
# 若 provider 不认这个字段并报 400，机器人会自动去掉它重试一次。
llm-max-tokens: 0
# 超时（毫秒）。聊天场景等 60 秒没有意义，默认 5s 连接 / 25s 读取。
llm-connect-timeout-ms: 5000
llm-read-timeout-ms: 25000
# 失败重试次数。只对网络错误与 5xx 生效；401/403/400 直接失败不重试。
llm-retry: 1
# 失败兜底话术（被 @ 时对方等不到回复会看到这句）
ai-fallback-message: "AI 无法处理该请求。"

##########################################
# 群聊白名单
##########################################
# 只有白名单里的群才会启用AI（旁听+回复）
# 留空 = 不限制，所有群都启用
# 填群的 openid（在群里发"菜单"可以看到群ID）
group-whitelist: []

##########################################
# 人格卡（决定 AI 是谁、怎么说话）
##########################################
# 为什么拆成字段而不是糊成一大段：规则越多模型越像在执行指令、越不像在聊天，
# 这是「AI 味」的根源。拆开之后每块只管一件事，改的时候才改得动。
#
# 「身份反差」比形容词有效得多：
#   ✗ "幽默风趣、善于交流"
#   ✓ "在服务器混了三年的老玩家，白天上班晚上上线"
#
# ⚠️ 配置读取说明：标量放 persona 段里（两端一致），
#    列表必须放顶层（persona-catchphrases / persona-forbidden），
#    因为 Velocity 端的配置读取是扁平 map，不支持 persona.xxx 这种点号路径。
persona:
  # 关掉 = 退回只使用下面的 personality 字段（兜底）
  enabled: true
  # 人设名，留空 = 取 QQ 机器人的实际昵称
  name: ""
  # 身份与背景：要具体、有反差
  identity: ""
  # 行为风格：怎么参与、什么时候闭嘴
  behavior: ""
  # 表达风格：句长、语气、用词
  reply: ""
  # 群聊专属约束（留空 = 用内置默认）
  group-rules: ""
  # 备用风格 + 触发概率（让回复不至于每次一个模板；0 = 不用）
  alt-style-text: ""
  alt-style-probability: 0.1

# 口头禅（会被轻微强化，但别每句都用）
persona-catchphrases: []

# 忌讳（进系统词的禁令段）
persona-forbidden:
  - "自称 AI / 机器人 / 助手 / 模型"
  - "用 markdown 分点、加粗、标题"
  - "写总结、结论、综上所述"
  - "每句都以问号结尾"

# 旧版单字段人格：现在只作为 persona.identity 为空时的兜底。
# 建议逐步迁移到上面的 persona 段里。
personality: "高情商的群友，说话让人舒服但不讨好，有梗有观点，该闭嘴时闭嘴"

##########################################
# few-shot 示例（消除 AI 味性价比最高的一项）
##########################################
# 纯规则做不到「教出语气」，示例可以。3 条通常就够：
# 多了只烧 token，少了抓不住规律。
# 场景要覆盖：被 @、插话、答不上来。第三条特别重要——
# 示范「不知道就说不知道」，这是最强的反 AI 信号。
few-shot:
  - user: "小雅：服务器现在卡吗"
    assistant: "看延迟的话应该还行，昨晚我这边一直满的"
  - user: "阿强：最近经济系统是不是崩了"
    assistant: "崩了，但崩得挺温和的，物价又涨了一轮"
  - user: "小雅：那个插件怎么装"
    assistant: "这个我还真不太清楚，你可以问问群主"

##########################################
# 服务器知识库（xt-group 自定义问答检索注入）
##########################################
# xt-group 在 replies.yml 配的自定义问答按「词汇级粗检索」注入 AI 系统词：
# 每次只挑与这条消息最相关的 top-K 条，最省 token；毫无重叠时不注入（零开销）。
# 问法与知识行完全无字面重叠时可能漏选——精确命中触发词仍由问答直接回复，不经 AI。
ai-knowledge-from-replies: true
# 每次最多注入几条知识
ai-knowledge-top-k: 3
# 注入知识的总字符数硬上限（top-K 条超出时截断）
ai-knowledge-max-chars: 1500

##########################################
# 超管立场记忆（让 AI 与群主保持一致）
##########################################
# 总开关：关掉后不再记录超管发言、也不再把立场注入提示词，AI 不会被迫"站群主那边"
ai-admin-stance-enable: true
# 是否把「待归纳」的逐字原文注入提示词。
# 默认 false：原文是群主的原话（含大量与立场无关的碎碎念），
# 注入后模型会被要求"保持一致"，容易在无关话题上硬表态、说些莫名其妙的话。
ai-admin-stance-inject-pending: false
# 注入时最多取最近几条（仅在上面的开关为 true 时生效）
ai-admin-stance-max-pending-inject: 3
# 隐私过滤正则：命中即视为个人隐私，不记录、不注入、也不进摘要。
# 留空 = 使用内置默认规则（财务状况、账号/凭证状态、健康等）。
# 填上则完全替换默认规则，每行一条正则（Java 正则）。
ai-admin-stance-privacy-filter: []

##########################################
# 攻击名单 + 黑名单
##########################################
# 攻击名单：这些用户说话时，AI 直接进入攻击模式（跳过判断，直接怼）
# 填用户ID（openid），留空 = 不启用
attack-targets:
  - "F58CFD76BEC930B6A32447099E01A1A2"
# 用户黑名单：这些用户永远不会触发AI回复（旁听记录正常，但AI不会理他们）
# 填用户ID，留空 = 不启用
blacklist-users:
  - "92D29612EA667F031B36794EFB737DB0"

##########################################
# 防刷 + 额度
##########################################
# 每小时 LLM 请求总数上限（硬上限）。judge（要不要插话）和正式生成都算。
# ⚠️ 一次自主插话会消耗 2 次额度（先 judge 一次，再生成一次），
#    所以实际插话条数约为这个值的一半。想保持原来的插话频率，把它调大一倍即可。
# 0 = 不限
ai-max-calls-per-hour: 60

# 每小时 judge 调用单独上限。judge 每条群消息都可能触发一次，是请求量的大头，
# 想省钱就单独设一个值（比如 20）。0 = 不单独限制（仍受上面的总上限约束）。
ai-max-judge-calls-per-hour: 0

# 每小时正式回复条数单独上限（不统计 judge）。0 = 不限。
ai-max-replies-per-hour: 0

##########################################
# 自主参与判断是否回复（傻模型）
##########################################
# 普通群消息先由轻量模型判断
chime-in-judge-enable: true
# ⚠️ 下面三项「留空 = 与主模型同一个 provider / 同一个 key / 同一个模型」，推荐保持留空。
#    只有当你要用便宜的第三方模型做判定时，才单独填 base-url + api-key（必须成对填）。
#    旧版本这里默认指向 OpenRouter 但 key 回退用主模型的 key，会导致每次 401 且静默失效。
chime-in-judge-base-url: ""
chime-in-judge-api-key: ""
chime-in-judge-model: ""
# 判定模型参数：判定要稳定，温度设 0；输出很短，64 token 足够。
chime-in-judge-temperature: 0
chime-in-judge-max-tokens: 64
# 普通自主插话要先攒够几条新群消息；每次回复后会在 min~max 之间重新选一个阈值
chime-in-min-messages: 3
chime-in-max-messages: 6
# 普通自主插话冷却；攻击超管不受这个冷却限制
chime-in-cooldown-seconds: 60

# 关键词黑名单（消息包含这些词 → 不触发AI，API根本不会调）
blocked-keywords:
  - "天气"
  - "运势"
  - "菜单"
  - "帮助"
  - "mcmod"
  - "模组"
  - "充值"
  - "支付"

##########################################
# 插话节奏（三层漏斗）
##########################################
# 第 1 层：规则打分器。分低于阈值直接不插话，连 judge 都不调 —— 这是省 token 的关键。
# 打分逻辑：被点名/求助/提问加分；刷屏/垃圾推广/复读/刚说过话减分。
#   0   = 只排除明显不该接的（噪声/推广/短反应），行为最接近"什么都能聊"
#   20  = 只有提问、求助、点到名才进下一步，明显更安静、更省 token
#   50  = 非常安静，接近同类成熟项目的严格档
reply-necessity-threshold: 0

# 第 3 层：回复概率。模型说"该说"之后还要掷一次骰子 —— 真人不会每次都接话。
# 群里越热闹、被 @ 越多，这个概率会被注意力加成放大。
group-chat-frequency: 0.2

# 防抖：真人不会秒回。等待期间有新消息会进到上下文里（提示词是延迟之后才拼的）。
# 等待期间如果有人 @ 了机器人，这次插话会让位给那条。
ai-reply-delay-quiet-ms: 2000     # 安静的群
ai-reply-delay-active-ms: 5000    # 热闹的群（10 秒内来了 3 条以上）
ai-reply-delay-direct-at-ms: 1000 # 被 @ 最多等 1 秒

# 复读防线：与最近说过的回复太像就丢掉，等下次换个说法。
# 0.75 = 比较严格；调低到 0.6 会更频繁地丢弃。
ai-repetition-threshold: 0.75

##########################################
# 群友画像（让 AI 认识这群人）
##########################################
# 记录谁说过多少次话、上次说了什么，注入提示词让 AI 能自然提起前情。
# 只存事实不编故事；按群隔离，不同群的人际关系不会串味。
ai-user-profile-enable: true
# 每次最多列几个人
ai-user-profile-max-entries: 5

##########################################
# 输出后处理（所有回复的唯一出口）
##########################################
# 模型产出直接发进群是最露怯的地方：markdown 符号原样显示、开口就是
# 「希望这对你有帮助」、被 @ 时把 NO_REPLY 这种内部标记甩给用户。
# 这里统一处理干净，不用改代码。
post-process:
  # 自主插话的单条上限（字）
  max-length-chime-in: 120
  # 被 @ 的单条上限（字）
  max-length-direct-at: 200
  # 概率性把长回复拆成多条发（真人有时一句话说完，有时连发两条）
  split-probability: 0.5
  # 最多拆成几条
  split-max-parts: 3

##########################################
# 敏感词过滤已统一由 core sensitive-filter-handlers 控制
# 只要 ai-chat 在 sensitive-filter-handlers 列表中，AI 输出自动走敏感词
##########################################
