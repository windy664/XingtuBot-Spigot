# AI 对话配置

# AI 对话功能开关
llm-enable: true

# LLM API 配置
llm-api-key: ""
llm-base-url: "https://token-plan-cn.xiaomimimo.com/v1"
# 纯文字模型（群聊日常对话，快）
llm-model: "mimo-v2.5"
# 多模态模型（有人发图片时自动切换，能看懂图片）
llm-model-omni: "mimo-v2-omni"

##########################################
# 群聊白名单
##########################################
# 只有白名单里的群才会启用AI（旁听+回复）
# 留空 = 不限制，所有群都启用
# 填群的 openid（在群里发"菜单"可以看到群ID）
group-whitelist: []

# AI 人格设定（核心：决定AI说话的风格）
# 写得越具体，AI越像真人。示例：
#   "群里的话痨，爱吐槽，经常发哈哈哈"
#   "安静但偶尔冒出一句精辟评论的潜水党"
#   "温柔、体贴、爱说简单话的女朋友，总是安静地倾听，温柔地回应"
personality: "群里的话痨，爱吐槽，经常发哈哈哈"

##########################################
# 攻击名单 + 黑名单
##########################################
# 攻击名单：这些用户说话时，AI 直接进入攻击模式（跳过判断，直接怼）
# 填用户ID（openid），留空 = 不启用
attack-targets:
  - "F58CFD76BEC930B6A32447099E01A1A2"
# 用户黑名单：这些用户永远不会触发AI回复（旁听记录正常，但AI不会理他们）
# 填用户ID，留空 = 不启用
blacklist-users:
  - "92D29612EA667F031B36794EFB737DB0"

##########################################
# 防刷 + 命令过滤
##########################################

# 全局每小时最大API调用次数（超限后所有触发静默跳过，0=不限）
# 60次 ≈ 平均1分钟1次，足够正常聊天，防连续刷
ai-max-calls-per-hour: 60

##########################################
# 自主参与判断是否回复（傻模型）
##########################################
# 普通群消息先由轻量模型判断
chime-in-judge-enable: true
# OpenRouter 兼容 OpenAI 接口；不用 OpenRouter 时改成你的兼容接口地址
chime-in-judge-base-url: "https://openrouter.ai/api/v1"
# 留空 = 复用上面的 llm-api-key；如果主模型不是 OpenRouter，就在这里单独填 OpenRouter key
chime-in-judge-api-key: ""
# OpenRouter 免费模型路由；会从可用免费模型中选择
chime-in-judge-model: "openrouter/free"
# 普通自主插话要先攒够几条新群消息；每次回复后会在 min~max 之间重新选一个阈值
chime-in-min-messages: 3
chime-in-max-messages: 6
# 普通自主插话冷却；攻击超管不受这个冷却限制
chime-in-cooldown-seconds: 60

# 关键词黑名单（消息包含这些词 → 不触发AI，API根本不会调）
blocked-keywords:
  - "天气"
  - "运势"
  - "菜单"
  - "帮助"
  - "mcmod"
  - "模组"
  - "充值"
  - "支付"

##########################################
# 敏感词过滤已统一由 core sensitive-filter-handlers 控制
# 只要 ai-chat 在 sensitive-filter-handlers 列表中，AI 输出自动走敏感词
##########################################
