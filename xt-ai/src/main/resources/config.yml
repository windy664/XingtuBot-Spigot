# XingtuBot-AI: AI 对话配置

# AI 对话功能开关
llm-enable: false

# LLM API 配置
llm-api-key: ""
llm-base-url: "https://token-plan-cn.xiaomimimo.com/v1"
# 纯文字模型（群聊日常对话，快）
llm-model: "mimo-v2.5"
# 多模态模型（有人发图片时自动切换，能看懂图片）
llm-model-omni: "mimo-v2-omni"

##########################################
# 群聊白名单
##########################################
# 只有白名单里的群才会启用AI（旁听+回复）
# 留空 = 不限制，所有群都启用
# 填群的 openid（在群里发"菜单"可以看到群ID）
group-whitelist: []

# AI 人格设定（核心：决定AI说话的风格）
# 写得越具体，AI越像真人。示例：
#   "群里的话痨，爱吐槽，经常发哈哈哈"
#   "安静但偶尔冒出一句精辟评论的潜水党"
#   "温柔、体贴、爱说简单话的女朋友，总是安静地倾听，温柔地回应"
personality: "群里的话痨，爱吐槽，经常发哈哈哈"

##########################################
# 防刷 + 命令过滤
##########################################

# 全局每小时最大API调用次数（超限后所有触发静默跳过，0=不限）
# 60次 ≈ 平均1分钟1次，足够正常聊天，防连续刷
ai-max-calls-per-hour: 60

# 命令关键词黑名单（消息包含这些词 → 不触发AI，API根本不会调）
# 已注册的XingtuBot命令前缀会自动过滤，这里补充非前缀型的关键词
# "登录""绑定""注册""白名单" 硬编码兜底，不需要重复写
blocked-keywords:
  - "天气"
  - "运势"
  - "菜单"
  - "帮助"
  - "mcmod"
  - "模组"
  - "充值"
  - "支付"

##########################################
# 敏感词过滤（AI 输出）
##########################################
# AI 对话回复是否过滤（LLM 输出不可控，建议开）
sensitive-filter-ai: true
# 是否启用（总开关）
Enable: true
# 替换字符
Replacement: '*'
# 本地词库
Local:
  - NMSL
  - fuck
  - shit
# 云端词库
Cloud-Thesaurus:
  Enabled: true
  Ignored: ['nt']
  Urls:
    - 'https://raw.githubusercontent.com/Yurinann/Filter-Thesaurus-Cloud/main/database.json'
# 匹配时忽略的标点符号
Ignored-Punctuations:
  - '!'
  - '.'
  - ','
  - '#'
  - '$'
  - '%'
  - '&'
  - '*'
  - '('
  - ')'
  - '|'
  - '?'
  - '/'
  - '@'
  - '"'
  - '\\'
  - ';'
  - '['
  - ']'
  - '{'
  - '}'
  - '+'
  - '~'
  - '-'
  - '_'
  - '='
  - '^'
  - '<'
  - '>'
  - ' '
  - '　'
  - '！'
  - '。'
  - '，'
  - '￥'
  - '（'
  - '）'
  - '？'
  - '、'
  - '"'
  - "'"
  - "'"
