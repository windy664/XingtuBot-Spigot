# XingtuBot-AI: AI 对话配置

# AI 对话功能开关
llm-enable: false

# LLM API 配置
llm-api-key: ""
llm-base-url: "https://api.deepseek.com"
llm-model: "deepseek-chat"

# AI 人格设定（核心：决定AI说话的风格）
# 写得越具体，AI越像真人。示例：
#   "群里的话痨，爱吐槽，经常发哈哈哈，说话喜欢用表情包"
#   "安静但偶尔冒出一句精辟评论的潜水党"
#   "温柔、体贴、爱说简单话的女朋友，总是安静地倾听，温柔地回应"
personality: "温柔、体贴、爱说简单话的女朋友，总是安静地倾听，温柔地回应，回复不超过100字"

# 机器人自称（在群上下文中显示的名字）
bot-name: "AI"

##########################################
# 自主参与（不用@也能参与群聊）
##########################################

# 自主参与概率（0.0~1.0）
# 每条群消息都会掷骰子，掷中了AI会"看一眼聊天记录，想想要不要说点什么"
# LLM 自己决定说不说（可以回 NO_REPLY 跳过）
# 0.03 = 平均每33条消息看一次，0.0 = 关闭自主参与
chime-in-probability: 0.03

# 跟超管观点冲突时的参与概率（0.0~1.0）
# 检测到有人的观点可能跟超管不一致时，AI会更积极地介入
# 0.5 = 50%概率介入帮超管说话
chime-in-conflict-probability: 0.5

##########################################
# 敏感词过滤（AI 输出）
##########################################
# AI 对话回复是否过滤（LLM 输出不可控，建议开）
sensitive-filter-ai: true
# 是否启用（总开关）
Enable: true
# 替换字符
Replacement: '*'
# 本地词库
Local:
  - NMSL
  - fuck
  - shit
# 云端词库
Cloud-Thesaurus:
  Enabled: true
  Ignored: ['nt']
  Urls:
    - 'https://raw.githubusercontent.com/Yurinann/Filter-Thesaurus-Cloud/main/database.json'
# 匹配时忽略的标点符号
Ignored-Punctuations:
  - '!'
  - '.'
  - ','
  - '#'
  - '$'
  - '%'
  - '&'
  - '*'
  - '('
  - ')'
  - '|'
  - '?'
  - '/'
  - '@'
  - '"'
  - '\\'
  - ';'
  - '['
  - ']'
  - '{'
  - '}'
  - '+'
  - '~'
  - '-'
  - '_'
  - '='
  - '^'
  - '<'
  - '>'
  - ' '
  - '　'
  - '！'
  - '。'
  - '，'
  - '￥'
  - '（'
  - '）'
  - '？'
  - '、'
  - '"'
  - "'"
  - "'"
  - '；'
  - '【'
